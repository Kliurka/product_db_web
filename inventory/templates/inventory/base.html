{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Stone Factory ERP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="{% static 'inventory/favicon.svg' %}" type="image/svg+xml">
    <link rel="manifest" href="{% url 'pwa_manifest' %}">
    <link rel="apple-touch-icon" href="{% url 'pwa_icon' 192 %}">
    <meta name="theme-color" content="#111111">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="stylesheet" href="{% static 'inventory/css/base.css' %}">
    <link rel="stylesheet" href="{% static 'inventory/css/ui.css' %}">
    <link rel="stylesheet" href="{% static 'inventory/css/forms.css' %}">
</head>
<body>

<div class="layout">

    {% include "components/sidebar.html" %}

    <main class="main">

        {% include "components/topbar.html" %}

        {% block content %}
        {% endblock %}

    </main>

</div>

<script src="{% static 'inventory/js/image_preview.js' %}"></script>
<script>
    const menuButton = document.querySelector(".mobile-menu-toggle");
    const sidebarNavigation = document.querySelector(".sidebar-navigation");

    if (menuButton && sidebarNavigation) {
        menuButton.addEventListener("click", function () {
            const isOpen = sidebarNavigation.classList.toggle("open");
            menuButton.setAttribute("aria-expanded", isOpen ? "true" : "false");
        });
    }
</script>

<script>
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
            navigator.serviceWorker.register("{% url 'service_worker' %}");
        });
    }
</script>

</body>
</html>
