{% extends "inventory/base.html" %}

{% block content %}
<div class="page">

    <div class="subtitle">Catalog Management / Products</div>
    <h1>Scan Product QR</h1>

    <div class="top-actions">
        <a href="{% url 'product_list' %}">
            <button type="button">← Back to products</button>
        </a>
    </div>

    {% if scan_error %}
        <div class="erp-panel qr-scan-error">
            <div class="erp-panel-title">QR not found</div>
            <p>{{ scan_error }}</p>
        </div>
    {% endif %}

    <div class="erp-panel qr-scan-panel">
        <div class="erp-panel-title">Camera Scanner</div>
        <div id="reader"></div>
    </div>

    <div class="erp-panel">
        <div class="erp-panel-title">Enter Code Manually</div>

        <form method="get" class="qr-manual-form">
            <input
                type="text"
                name="code"
                placeholder="Product code"
                value="{{ scanned_code|default:'' }}"
                required
            >
            <button class="btn-dark" type="submit">
                Open Product
            </button>
        </form>
    </div>

</div>

<script src="https://unpkg.com/html5-qrcode"></script>
<script>
let scanLocked = false;

function onScanSuccess(decodedText) {
    if (scanLocked) {
        return;
    }

    scanLocked = true;

    window.location.href =
        "{% url 'scan_qr' %}?code=" +
        encodeURIComponent(decodedText);
}

const scanner = new Html5QrcodeScanner(
    "reader",
    {
        fps: 10,
        qrbox: {
            width: 250,
            height: 250
        },
        rememberLastUsedCamera: true
    },
    false
);

scanner.render(onScanSuccess);
</script>
{% endblock %}
